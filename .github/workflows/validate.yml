name: Validate Skill Catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run validator tests
        run: python -m unittest discover -s tests
      - name: Validate catalog policy
        run: python scripts/validate_skills.py
      - name: Validate Agent Skills compatibility
        run: python scripts/validate_agent_skills_spec.py
      - name: Check generated catalog files
        run: python scripts/generate_catalog.py --check
      - name: Resolve remote sources and verify lock provenance
        run: python scripts/sync_sources.py --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify pinned skills CLI discovery
        shell: bash
        run: |
          set -o pipefail
          NO_COLOR=1 npx --yes skills@1.5.23 add . --list \
            | python scripts/validate_cli_discovery.py
          NO_COLOR=1 npx --yes skills@1.5.23 add . --list --full-depth \
            | python scripts/validate_cli_discovery.py
